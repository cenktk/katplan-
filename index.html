<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kat Planı Tasarımı</title>
<style>
/* Kat Planı Tasarımı — ana stil dosyası (2D arayüz + 3D kaplamaları) */
:root{
  --bg:#f3efe7;--paper:#f7f4ee;--panel:#fffdf9;--line:#e3dccf;--ink:#2b2824;
  --muted:#8a8174;--accent:#b5653a;--accent-soft:#f3e3d8;--teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@media (pointer:coarse){html,body{font-size:14px}}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:pointer}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- iskelet ---------- */
.app{display:grid;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;
  transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (min-width:1101px){
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
}
header{grid-column:1/-1;grid-row:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px 7px;
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:8}
footer{grid-column:1/-1;grid-row:3;height:30px;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
footer b{color:var(--ink);font-weight:500}
footer .grow{flex:1}
#tip{overflow:hidden;text-overflow:ellipsis;min-width:0}
aside.lib{grid-row:2;grid-column:1;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-width:0}
aside.lib>div{min-width:220px}
aside.right{grid-row:2;grid-column:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-width:0}
#panel{min-width:284px}
@media (min-width:1101px){
  .app.hide-lib aside.lib{overflow:hidden;border:0}
  .app.hide-panel aside.right{overflow:hidden;border:0}
}
main{grid-row:2;grid-column:2;position:relative;overflow:hidden;background:var(--paper);min-width:0;min-height:0}

/* ---------- genel bileşenler ---------- */
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:20px;font-size:inherit}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.btn:disabled{cursor:default}
.btn.outl,details.menu>summary.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.btn.outl:hover,details.menu>summary.btn:hover{background:#f2ece2}
.spacer{flex:1}
.only3d{display:none}
body.m3d .only2d{display:none}
body.m3d .only3d{display:flex}
.only2d,.only3d{animation:fadeIn .45s ease}
body.m3d .st2d{display:none}
#histGrp,#paneBtns,.brand,#viewSeg{animation:none}

.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:8px;min-width:0}
.brand b{font-size:15px;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;text-align:center;color:var(--ink);transition:color .45s;background:transparent}
.seg .btn:hover{background:transparent}
.seg .btn.on{color:#fff;background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg.is3d .pill{transform:translateX(84px)}
body.busy #viewSeg{pointer-events:none}

details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease;display:flex;flex-direction:column}
.menu-pop .btn{text-align:left}

.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px;line-height:26px}
.range input{width:84px;accent-color:var(--accent)}
.range b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 16px;
  border-radius:8px;z-index:10;transition:.25s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

#modehint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:5px 12px;border-radius:20px;
  font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#modehint.show{opacity:.9}
body.m3d #modehint{display:none}

#scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:12px;pointer-events:none;transition:opacity .3s;z-index:1;line-height:1.5}
#scalebar #sbTxt{display:block}
#scalebar #sbBar{display:block;height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px;box-sizing:content-box}
main.is3d #scalebar{opacity:0}

#ghost{position:fixed;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3));display:none}
#ghost svg{display:block;overflow:visible}

/* ---------- kitaplık ---------- */
aside.lib h4{margin:0;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;padding:12px 14px 6px;position:sticky;top:0;z-index:1;background:var(--panel)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:8px;
  background:#fff;cursor:grab;touch-action:pan-y;transition:border-color .15s,transform .15s;text-align:center;min-width:0}
.item svg{width:56px;height:44px;display:block;flex:none}
.item b{font-size:12px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.item small{font-size:11px;color:var(--muted)}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
.item.dragging{border-color:var(--accent);opacity:.5}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
#lib3d{display:none}
body.m3d #lib3d{display:block}
#roomList{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 10px 6px}
#roomList button{border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;text-align:left;line-height:1.3;cursor:pointer;min-width:0}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList button small{display:block;color:var(--muted);font-size:11px}
#roomList button.on small{color:var(--accent)}

/* ---------- sağ panel ---------- */
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
#panel table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
#panel td{padding:4px 0;border-bottom:1px dashed #eee6d9}
#panel tr:last-child td{border-bottom:0}
#panel td.r{text-align:right;white-space:nowrap}
#panel td.r+td.r{padding-left:14px}
#panel tr[data-room],#panel tr[data-fid]{cursor:pointer}
#panel tr[data-room]:hover,#panel tr[data-fid]:hover{background:#faf5ee}
#panel td .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
#panel td em{font-style:normal;color:var(--muted)}
#panel td.m{color:var(--muted);text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px}
.total b{color:var(--accent);font-weight:600;font-size:14px}
.note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats>div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;font-size:11px;color:var(--muted)}
.stats .big{font-size:22px;font-weight:600;line-height:1.25}
.stats .big i{font-style:normal;font-size:12px;font-weight:400;margin-left:2px;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{border:1px solid var(--line);background:#fff}
.acts .btn:hover{background:#f2ece2}
.acts .btn.danger{color:#b3372a}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px;min-width:0}
.form label.full{grid-column:1/-1}
.form input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%;color:var(--ink);min-width:0}
.form input[type=color]{height:30px;padding:2px}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mats button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;text-align:left;min-width:0}
.mats button .sw{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mats button b{display:block;font-size:12px;font-weight:500;line-height:1.25}
.mats button small{color:var(--muted);font-size:11px}
.mats button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kbdg{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
.kbdg kbd{justify-self:start}
.muted12{font-size:12px;color:var(--muted)}
@media (pointer:coarse){#panel td{padding:7px 2px}.mats button{padding:9px 8px}}

/* ---------- SVG ---------- */
#plan{outline:none;display:block;width:100%;height:100%;touch-action:none;transition:opacity .45s ease}
#plan text{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#plan *{vector-effect:non-scaling-stroke}
#plan .wall{pointer-events:none}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan .room{cursor:default}
#plan.tool-select .room:hover{opacity:.82}
#plan g.furn{cursor:move}
@media (hover:hover){#plan g.furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
#plan.tool-measure,#plan.tool-measure *{cursor:crosshair}
#plan.panning,#plan.panning *{cursor:grabbing!important}
#plan [data-handle]{cursor:pointer}
#plan [data-handle=size]{cursor:nwse-resize}
#plan .noptr{pointer-events:none}

/* ---------- tuval katmanları ---------- */
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
#view3d canvas{display:block;outline:none}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;padding:5px 14px;
  font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
main.is3d #hint3d{opacity:1}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px;font-size:inherit}
#walkOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay .card{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px;font-size:16px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross::before{left:6px;top:0;width:2px;height:14px}
#cross::after{left:0;top:6px;width:14px;height:2px}
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);border:2px solid rgba(255,255,255,.7);
  box-shadow:0 4px 18px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:3;touch-action:none}
#joy #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:16px;z-index:3;padding:9px 16px;border-radius:10px;font-weight:500}
main:not(.is3d) #walkOverlay,main:not(.is3d) #cross,main:not(.is3d) #joy,main:not(.is3d) #walkExit{display:none!important}

/* ---------- yüzen çubuk ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;gap:4px;align-items:center;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);z-index:4;
  max-width:calc(100% - 24px);opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s}
#fab.show{opacity:1;transform:translate(-50%,0);visibility:visible;transition:opacity .2s ease,transform .2s ease}
#fab .btn{border:1px solid transparent}
#fab .name{font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
#fab .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
#fab .narrow-only{display:none}
main.drawer-panel #fab{opacity:0;visibility:hidden;pointer-events:none}

/* ---------- dar ekran: çekmeceler ---------- */
@media (max-width:1100px){
  .app,.app.hide-lib,.app.hide-panel{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s cubic-bezier(.3,.7,.3,1)}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.lib.open,aside.right.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .grid{grid-template-columns:repeat(3,1fr)}
  .brand span{display:none}
  .brand b{font-size:14px;letter-spacing:.3px;white-space:normal;max-width:150px;line-height:1.2}
  .st2d{display:none}
  #fab .narrow-only{display:inline-block}
}
@media (pointer:coarse){
  header{padding:8px 12px 8px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn{width:92px}
  .seg .pill{width:92px}
  .seg.is3d .pill{transform:translateX(94px)}
  details.menu>summary.btn{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  input,select,textarea{font-size:16px}
  .form input{padding:8px 9px}
  .form input[type=color]{height:40px}
  #fab .btn{min-height:42px;padding:9px 14px}
  .acts .btn{min-height:42px;padding:9px 14px}
  #roomList button{padding:8px 10px}
  .range input{width:120px}
}
#plan pattern *{vector-effect:none}
#plan text{vector-effect:none}
.item svg *,#ghost svg *{vector-effect:non-scaling-stroke}


</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app" id="app">
  <header id="topbar">
    <div class="grp" id="paneBtns">
      <button class="btn chip on" id="tgLib" data-en="◧ Library" data-en-title="Hide library ( [ )" title="Mobilya kitaplığını gizle ( [ )">◧ Mobilya</button>
      <button class="btn chip on" id="tgPanel" data-en="Properties ◨" data-en-title="Hide properties ( ] )" title="Özellik panelini gizle ( ] )">Özellikler ◨</button>
    </div>
    <div class="brand"><b id="brandTitle" data-en="3BR 2LR 2BA · Interior Design">3+1 Daire · Dekorasyon Tasarımı</b><span id="brandSub"></span></div>
    <div class="grp seg" id="viewSeg" data-en-title="Switch 2D / 3D (T)" title="2D / 3D geçiş (T)">
      <i class="pill"></i>
      <button class="btn on" data-view="2d" data-en="2D Plan">2D Plan</button>
      <button class="btn" data-view="3d" data-en="3D Scene">3D Sahne</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" data-en="Select" data-en-title="Select / Move (V)" title="Seç / Taşı (V)">Seç</button>
      <button class="btn" data-tool="measure" data-en="Measure" data-en-title="Measure (M)" title="Ölç (M)">Ölç</button>
      <button class="btn" data-tool="demolish" data-en="Demolish" data-en-title="Demolish non-bearing walls (X)" title="Taşıyıcı olmayan duvarı yık (X)">Duvar Yık</button>
    </div>
    <div class="grp only2d" id="zoomGrp">
      <button class="btn" id="zOut" data-en-title="Zoom out" title="Uzaklaştır">−</button>
      <button class="btn" id="zIn" data-en-title="Zoom in" title="Yakınlaştır">＋</button>
      <button class="btn" id="zFit" data-en="Fit" data-en-title="Fit to window (F)" title="Pencereye sığdır (F)">Sığdır</button>
      <button class="btn" id="z60" data-en-title="Show at 1:60 (same scale as the original plan)" title="1:60 göster (özgün planla aynı ölçek)">1:60</button>
      <button class="btn" id="z100" data-en-title="Show at 1:100" title="1:100 göster">1:100</button>
    </div>
    <div class="grp only3d" id="modes3d">
      <button class="btn on" data-mode="orbit" data-en="Orbit">Kuşbakışı</button>
      <button class="btn" data-mode="walk" data-en="Walk">Gezinti</button>
    </div>
    <div class="grp only3d" id="cams3d">
      <button class="btn" id="vIso" data-en="Iso">Eğik</button>
      <button class="btn" id="vTop" data-en="Top">Üstten</button>
    </div>
    <div class="grp" id="histGrp">
      <button class="btn" id="undo" disabled style="opacity:.4" data-en="Undo" data-en-title="Undo (Ctrl+Z)" title="Geri al (Ctrl+Z)">Geri Al</button>
      <button class="btn" id="redo" disabled style="opacity:.4" data-en="Redo" data-en-title="Redo (Ctrl+Shift+Z)" title="Yinele (Ctrl+Shift+Z)">Yinele</button>
      <button class="btn danger" id="clearAll" data-en="Clear" data-en-title="Remove all furniture and appliances (undoable)" title="Tüm mobilya ve cihazları kaldır (geri alınabilir)">Yerleşimi Temizle</button>
    </div>
    <div class="grp only2d" id="layers">
      <button class="btn chip on" data-layer="dims" data-en="Dims">Ölçü</button>
      <button class="btn chip on" data-layer="rooms" data-en="Rooms">Odalar</button>

/* ---------- ilkel şekiller (g grubuna bağlı) ---------- */
function H(g) {
  const add = (geo, m, x = 0, y = 0, z = 0, noCast) => {
    const me = new THREE.Mesh(geo, m);
    me.position.set(x, y, z);
    me.castShadow = !(noCast || m.transparent);
    me.receiveShadow = true;
    g.add(me);
    return me;
  };
  const h = {
    add,
    box: (w, hh, d, m, x = 0, y = 0, z = 0) => add(BOX(w, hh, d), m, x, y + hh / 2, z),
    rbox: (w, hh, d, m, x = 0, y = 0, z = 0, r = 0.04) => add(RBOX(w, hh, d, r), m, x, y + hh / 2, z),
    cyl: (rt, rb, hh, m, x = 0, y = 0, z = 0, seg = 28) => add(CYL(rt, rb, hh, seg), m, x, y + hh / 2, z),
    cylX: (rt, rb, len, m, x, yc, zc, seg = 24) => { const me = add(CYL(rt, rb, len, seg), m, x, yc, zc); me.rotation.z = PI / 2; return me; },
    cylZ: (rt, rb, len, m, x, yc, zc, seg = 24) => { const me = add(CYL(rt, rb, len, seg), m, x, yc, zc); me.rotation.x = PI / 2; return me; },
    lathe: (pts, m, x = 0, y = 0, z = 0, seg = 40) => add(LATHE(pts, seg), m, x, y, z),
    blob: (rx, ry, rz, m, x = 0, y = 0, z = 0) => { const me = add(SPH(), m, x, y, z); me.scale.set(rx, ry, rz); return me; },
    ring: (Rr, r, m, x = 0, y = 0, z = 0) => { const me = add(TORUS(Rr, r), m, x, y, z); me.rotation.x = PI / 2; return me; },
    rod: (a, b, r0, m, r1) => {
      if (r1 === undefined) r1 = r0;
      const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
      const dir = vb.clone().sub(va), len = dir.length();
      const me = add(CYL(r1, r0, len, 10), m, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2);
      me.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      return me;
    },
    tube: (pts, r, m) => {
      const key = `tube${r}:${pts.map(p => p.map(q).join(',')).join(';')}`;
      const geo = cg(key, () => new THREE.TubeGeometry(
        new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'centripetal'), pts.length * 10, r, 8, false));
      return add(geo, m, 0, 0, 0);
    },
    shell: (w, d, hh, t, r, m, x = 0, y = 0, z = 0) => {
      const geo = cg(`sh${q(w)},${q(d)},${q(hh)},${q(t)},${q(r)}`, () => {
        const s = rrShape(w, d, r);
        s.holes.push(rrShape(w - 2 * t, d - 2 * t, Math.max(r - t, 0.01)));
        const e = new THREE.ExtrudeGeometry(s, { depth: hh, bevelEnabled: false, curveSegments: 8 });
        e.rotateX(-PI / 2);
        return e;
      });
      return add(geo, m, x, y, z);
    },
    slab: (w, d, hh, holes, m, x = 0, y = 0, z = 0) => {
      const key = `sl${q(w)},${q(d)},${q(hh)}:` + holes.map(o => [o.x, o.z, o.w, o.d, o.r].map(q).join(',')).join(';');
      const geo = cg(key, () => {
        const s = rrShape(w, d, 0.004);
        holes.forEach(o => s.holes.push(rrShape(o.w, o.d, o.r, o.x, -o.z)));
        const e = new THREE.ExtrudeGeometry(s, { depth: hh, bevelEnabled: false, curveSegments: 6 });
        e.rotateX(-PI / 2);
        return e;
      });
      return add(geo, m, x, y, z);
    },
    legs: (w, d, hh, m, inset, r) => {
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        h.cyl(r, r * 0.7, hh, m, sx * (w / 2 - inset), 0, sz * (d / 2 - inset), 12);
      }
    },
    sub: (x, y, z, ry = 0) => {
      const s = new THREE.Group(); s.position.set(x, y, z); s.rotation.y = ry; g.add(s); return H(s);
    },
  };

  /* Kapak / çekmece paneli: bir bölgeyi nx x ny bölerek panel + kulp üretir. o.z = gövde ön yüzü */
  h.fronts = o => {
    const { x0, x1, y0, y1, z, nx, ny, m, hd = 'bar', hy } = o;
    const W = x1 - x0, HH = y1 - y0, pw = W / nx, ph = HH / ny;
    h.box(W, HH, 0.006, mat('#2a2724'), (x0 + x1) / 2, y0, z + 0.003);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const px0 = x0 + i * pw, py0 = y1 - (j + 1) * ph;
      const cx = px0 + pw / 2;
      h.rbox(pw - 0.005, ph - 0.005, 0.018, m, cx, py0 + 0.0025, z + 0.009, 0.003);
      const fz = z + 0.018;
      const drawer = ph < 0.4 && pw >= ph;
      if (hd === 'bar') {
        if (drawer) {
          const L = Math.min(0.3, pw * 0.45);
          h.box(L, 0.01, 0.01, hwMat(), cx, py0 + ph * 0.5 - 0.005, fz + 0.028);
          h.box(0.01, 0.01, 0.028, hwMat(), cx - L / 2 + 0.005, py0 + ph * 0.5 - 0.005, fz + 0.014);
          h.box(0.01, 0.01, 0.028, hwMat(), cx + L / 2 - 0.005, py0 + ph * 0.5 - 0.005, fz + 0.014);
        } else {
          const L = Math.min(0.45, ph * 0.35);
          const hx = nx === 1 ? px0 + pw - 0.045 : (i % 2 === 0 ? px0 + pw - 0.045 : px0 + 0.045);
          let hyy = hy !== undefined ? Math.max(py0 + L / 2 + 0.02, Math.min(py0 + ph - L / 2 - 0.02, hy)) : py0 + ph / 2;
          h.box(0.01, L, 0.01, hwMat(), hx, hyy - L / 2, fz + 0.028);
          h.box(0.01, 0.01, 0.028, hwMat(), hx, hyy - L / 2, fz + 0.014);
          h.box(0.01, 0.01, 0.028, hwMat(), hx, hyy + L / 2 - 0.01, fz + 0.014);
        }
      } else if (hd === 'knob') {
        const kx = drawer ? cx : (i % 2 === 0 ? px0 + pw - 0.05 : px0 + 0.05);
        const ky = drawer ? py0 + ph / 2 : py0 + ph * 0.5;
        h.cylZ(0.008, 0.008, 0.02, hwMat(), kx, ky, fz + 0.01, 12);
        h.blob(0.016, 0.016, 0.016, hwMat(), kx, ky, fz + 0.026);
      } else if (hd === 'edge') {
        h.box(pw - 0.03, 0.012, 0.012, mat('#3c3a37'), cx, py0 + ph - 0.03, fz - 0.004);
      }
    }
  };
  return h;
}

/* ---------- süs nesneleri ---------- */
function vase(h, x, y, z, o = {}) {
  const hh = o.h || 0.28, r = o.r || 0.07;
  h.lathe([[0, 0], [0.65 * r, 0], [r, 0.32 * hh], [0.92 * r, 0.62 * hh], [0.42 * r, 0.86 * hh], [0.5 * r, hh]],
    mat(o.color || '#e6dfd1', { roughness: 0.35, side: DS }), x, y, z, 24);
  if (o.flowers) {
    const cols = ['#f3e6d8', '#e8b4a0', '#f6d27a', '#ffffff'];
    for (let i = 0; i < 5; i++) {
      const a = R() * PI * 2, tl = 0.2 + R() * 0.14, ph = 0.12 + R() * 0.38;
      const top = [x + Math.cos(a) * Math.sin(ph) * tl, y + hh + Math.cos(ph) * tl, z + Math.sin(a) * Math.sin(ph) * tl];
      h.rod([x, y + hh * 0.8, z], top, 0.0028, mat('#6f8f4a', { roughness: 0.8 }));
      h.blob(0.02, 0.02, 0.02, mat(cols[Math.floor(R() * 4)], { roughness: 0.8 }), top[0], top[1], top[2]);
    }
  }
}
function tableLamp(h, x, y, z, s = 1) {
  h.lathe([[0, 0], [0.06 * s, 0], [0.075 * s, 0.06 * s], [0.07 * s, 0.15 * s], [0.03 * s, 0.24 * s], [0.02 * s, 0.28 * s]],
    mat('#e9e2d4', { roughness: 0.15 }), x, y, z, 20);
  h.lathe([[0.1 * s, 0], [0.065 * s, 0.17 * s]], mat('#f6ecd9', { emissive: '#ffdca0', emissiveIntensity: 0.35, side: DS, roughness: 0.8 }),
    x, y + 0.26 * s, z, 24);
  h.blob(0.028 * s, 0.035 * s, 0.028 * s, glowMat(), x, y + 0.31 * s, z);
}
function plate(h, x, y, z, r = 0.115) {
  h.lathe([[0, 0.003], [0.55 * r, 0.003], [r * 0.95, 0.016], [r, 0.02], [r * 0.98, 0.02]], mat('#fbfaf6', { roughness: 0.15, side: DS }), x, y, z, 24);
}
function cup(h, x, y, z, s = 1, col = '#ffffff') {
  h.lathe([[0, 0], [0.026 * s, 0], [0.033 * s, 0.085 * s], [0.03 * s, 0.085 * s], [0.024 * s, 0.01 * s]], mat(col, { roughness: 0.15, side: DS }), x, y, z, 16);
}
function fruitBowl(h, x, y, z, n = 3, rr = 0.15) {
  h.lathe([[0, 0], [rr * 0.4, 0], [rr, 0.06], [rr * 1.02, 0.065], [rr * 0.95, 0.065], [rr * 0.35, 0.012]], mat('#e9e2d4', { roughness: 0.3, side: DS }), x, y, z, 24);
  const cols = ['#d9573b', '#e8b33c', '#8fb04a', '#c8462f'];
  for (let i = 0; i < n; i++) {
    const a = i / n * PI * 2 + 0.5, rad = n > 1 ? rr * 0.38 : 0;
    h.blob(0.035, 0.033, 0.035, mat(cols[i % 4], { roughness: 0.6 }), x + Math.cos(a) * rad, y + 0.06, z + Math.sin(a) * rad);
  }
}
function bookStack(h, x, y, z, list) {
  let yy = y;
  list.forEach(([bw, bh, bd, col], i) => {
    const b = h.box(bw, bh, bd, mat(col, { roughness: 0.75 }), x + (R() - 0.5) * 0.02, yy, z);
    b.rotation.y = (R() - 0.5) * 0.4;
    yy += bh;
  });
  return yy;
}

  h.rbox(w - 0.02, 0.03, d - 0.05, wd, 0, 0.41, 0, 0.01);
  h.rbox(w - 0.04, 0.05, d - 0.08, fabric(c), 0, 0.44, 0.005, 0.02);
  const rb = h.rbox(w - 0.08, 0.15, 0.025, wd, 0, 0.62, bz + 0.05, 0.008);
  rb.rotation.x = -0.08;
  h.rbox(w - 0.06, 0.05, 0.03, wd, 0, 0.8, bz + 0.04, 0.01);

B.bookshelf = (h, w, d, c) => {
  const bz = -d / 2, wd = woodM(c);
  const HT = 1.8, tk = 0.022;
  h.box(w, HT, 0.01, woodM(darker(c, 0.85)), 0, 0, bz + 0.005);
  for (const sx of [-1, 1]) h.box(tk, HT, d, wd, sx * (w / 2 - tk / 2), 0, 0);
  const ys = [0.03];
  for (let i = 1; i <= 4; i++) ys.push(0.03 + (HT - 0.03 - tk - 0.03) * i / 5);
  ys.push(HT - tk);
  ys.forEach(y => h.box(w - 2 * tk, tk, d - 0.01, wd, 0, y, 0.005));
  h.box(w - 2 * tk, 0.03, d - 0.01, wd, 0, 0, 0.005);
  const pal = ['#b88a6a', '#6f8f8a', '#d9c08c', '#9aa58c', '#a8675e', '#e6dccd', '#7d8ea3', '#c9bfae'];
  for (let s = 0; s < 5; s++) {
    const y0 = ys[s] + tk, y1 = ys[s + 1], gap = y1 - y0;
    const deco = R() < 0.55;
    const xEnd = w / 2 - tk - (deco ? 0.16 : 0.01);
    let x = -w / 2 + tk + 0.01;
    while (x < xEnd - 0.03) {
      if (R() < 0.07) { x += 0.04 + R() * 0.06; continue; }
      const bw = 0.018 + R() * 0.03, bh = Math.min(gap - 0.03, 0.17 + R() * 0.13), bd = d * (0.62 + R() * 0.22);
      if (x + bw > xEnd) break;
      const b = h.box(bw, bh, bd, mat(pal[Math.floor(R() * pal.length)], { roughness: 0.75 }), x + bw / 2, y0, bz + 0.01 + bd / 2);
      if (R() < 0.05) b.rotation.z = 0.15;
      x += bw + 0.002;
    }
    if (deco) {
      if (R() < 0.5) vase(h, w / 2 - tk - 0.09, y0, bz + d * 0.5, { h: 0.2, r: 0.045, color: pal[Math.floor(R() * 8)] });
      else bookStack(h, w / 2 - tk - 0.09, y0, bz + d * 0.5, [[0.16, 0.03, 0.2, pal[Math.floor(R() * 8)]], [0.15, 0.025, 0.19, pal[Math.floor(R() * 8)]], [0.14, 0.03, 0.18, pal[Math.floor(R() * 8)]]]);
    }
  }
};

/* ===== Salon ===== */
function seatCushions(h, w, d, c, sofaLike) {
  const bz = -d / 2;
  const fb = fabric(c), fb2 = fabric(darker(c, 0.88));
  h.legs(w, d, 0.12, woodM('#3a3027'), 0.07, 0.018);
  h.rbox(w, 0.16, d, fb2, 0, 0.12, 0, 0.05);
  const bd = Math.min(0.2, d * 0.24), a = Math.min(0.18, w * 0.14);
  h.rbox(w, 0.73, bd, fb2, 0, 0.12, bz + bd / 2, 0.06);
  for (const sx of [-1, 1]) h.rbox(a, 0.5, d, fb2, sx * (w / 2 - a / 2), 0.12, 0, 0.06);
  const n = sofaLike ? (w > 2.2 ? 3 : 2) : 1;
  const cw = (w - 2 * a) / n, sd = d - bd - 0.02;
  for (let i = 0; i < n; i++) {
    const x = -w / 2 + a + cw * (i + 0.5);
    h.rbox(cw - 0.012, 0.15, sd, fb, x, 0.28, bz + bd + 0.01 + sd / 2, 0.05);
    const bk = h.rbox(cw - 0.03, 0.44, 0.16, fb, x, 0.42, bz + bd + 0.07, 0.06);
    bk.rotation.x = -0.16;
  }
  if (n > 1) {
    const p1 = h.rbox(0.42, 0.42, 0.12, fabric('#ece5d8'), -w / 2 + a + 0.26, 0.43, bz + bd + 0.2, 0.05);
    p1.rotation.set(-0.25, 0.2, 0.1);
    const p2 = h.rbox(0.42, 0.42, 0.12, fabric(darker(c, 0.7)), w / 2 - a - 0.26, 0.43, bz + bd + 0.2, 0.05);
    p2.rotation.set(-0.25, -0.3, -0.08);
  } else {
    const p = h.rbox(0.4, 0.26, 0.1, fabric('#ece5d8'), 0, 0.43, bz + bd + 0.2, 0.05);
    p.rotation.x = -0.35;
  }
}
B.sofa = (h, w, d, c) => seatCushions(h, w, d, c, true);
B.armchair = (h, w, d, c) => seatCushions(h, w, d, c, false);

B.cornersofa = (h, w, d, c) => {
  const bz = -d / 2, fz = d / 2;
  const fb = fabric(c), fb2 = fabric(darker(c, 0.88));
  const k = Math.min(0.95, d * 0.56, w * 0.4), b = 0.2;
  const wl = -w / 2;
  const lm = woodM('#3a3027');
  for (const [x, z] of [[wl + 0.08, bz + 0.08], [w / 2 - 0.08, bz + 0.08], [w / 2 - 0.08, bz + k - 0.08], [wl + k - 0.08, bz + k], [wl + 0.08, fz - 0.08], [wl + k - 0.08, fz - 0.08]])
    h.cyl(0.018, 0.013, 0.1, lm, x, 0, z, 12);
  h.rbox(w, 0.18, k, fb2, 0, 0.1, bz + k / 2, 0.05);
  h.rbox(k, 0.18, d - k + 0.02, fb2, wl + k / 2, 0.1, bz + k + (d - k) / 2 - 0.01, 0.05);
  h.rbox(w, 0.72, b, fb2, 0, 0.1, bz + b / 2, 0.06);
  h.rbox(b, 0.72, d, fb2, wl + b / 2, 0.1, 0, 0.06);
  h.rbox(0.2, 0.5, k, fb2, w / 2 - 0.1, 0.1, bz + k / 2, 0.06);
  h.rbox(k, 0.5, 0.2, fb2, wl + k / 2, 0.1, fz - 0.1, 0.06);
  const cw = (w - b - 0.2) / 2;
  for (let i = 0; i < 2; i++) {
    const x = wl + b + cw * (i + 0.5);
    h.rbox(cw - 0.012, 0.15, k - b - 0.02, fb, x, 0.28, bz + b + (k - b) / 2, 0.05);
    const bk = h.rbox(cw - 0.03, 0.44, 0.16, fb, x, 0.42, bz + b + 0.07, 0.06);
    bk.rotation.x = -0.16;
  }
  h.rbox(k - b - 0.02, 0.15, d - k - 0.22, fb, wl + b + (k - b) / 2, 0.28, bz + k + (d - k - 0.22) / 2 + 0.01, 0.05);
  const m = Math.max(1, Math.round((d - 0.2 - b - 0.18) / 0.75));
  const Ld = d - b - 0.2 - k * 0 - 0.02;
  const zs = bz + k, ze = fz - 0.22 - 0.02;
  const seg = (ze - zs) / Math.max(1, m);
  for (let i = 0; i < m; i++) {
    const bk = h.rbox(0.16, 0.44, seg - 0.03, fb, wl + b + 0.07, 0.42, zs + seg * (i + 0.5), 0.06);
    bk.rotation.z = 0.16;
  }
  const p1 = h.rbox(0.42, 0.42, 0.12, fabric('#ece5d8'), wl + b + 0.3, 0.43, bz + b + 0.15, 0.05);
  p1.rotation.set(-0.25, 0.25, 0.05);
  const p2 = h.rbox(0.4, 0.4, 0.12, fabric(darker(c, 0.7)), w / 2 - 0.4, 0.43, bz + b + 0.15, 0.05);
  p2.rotation.set(-0.25, -0.25, -0.05);
};

B.plant = (h, w, d, c) => {
  const r = Math.min(w, d) / 2, HT = 0.9 + 1.6 * r;
  h.lathe([[0, 0], [0.4 * r, 0], [0.44 * r, 0.02], [0.54 * r, 0.36], [0.57 * r, 0.4], [0.52 * r, 0.4], [0.5 * r, 0.37], [0, 0.37]],
    mat('#d9d2c5', { roughness: 0.7, side: DS }), 0, 0, 0, 28);
  h.cyl(0.5 * r, 0.5 * r, 0.02, mat('#4a3a2c', { roughness: 1 }), 0, 0.35, 0, 20);
  const tm = mat('#6b5540', { roughness: 0.85 });
  h.rod([0, 0.36, 0], [0.02, HT * 0.9, 0.01], 0.014, tm, 0.007);
  const N = 20 + Math.round(36 * r);
  const g1 = mat('#5f8f4e', { roughness: 0.6 }), g2 = mat('#79a862', { roughness: 0.6 });
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), a = i * 2.399;
    const yy = HT * (0.42 + 0.58 * t);
    const len = (0.14 + R() * 0.08) * (1.1 - 0.4 * t) * Math.sqrt(r / 0.25) * 1.25;
    const droop = 0.1 + 0.5 * t + R() * 0.3;
    const dir = new THREE.Vector3(Math.cos(a) * Math.cos(droop), -Math.sin(droop) * 0.7 + 0.15, Math.sin(a) * Math.cos(droop)).normalize();
    const base = new THREE.Vector3(0.02 * t, yy, 0.01 * t);
    const sap = base.clone().add(new THREE.Vector3(Math.cos(a) * 0.06, 0.03, Math.sin(a) * 0.06));
    h.rod([base.x, base.y, base.z], [sap.x, sap.y, sap.z], 0.003, tm);
    const ctr = sap.clone().addScaledVector(dir, len / 2);
    const me = h.blob(len / 2, 0.005, len * 0.27, i % 2 ? g2 : g1, ctr.x, ctr.y, ctr.z);
    me.material = i % 2 ? g2 : g1;
    me.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);
  }
};

B.table = (h, w, d, c) => {
  const dk = darker(c, 0.55);
  h.legs(w, d, 0.715, woodM(dk), 0.07, 0.035);
  h.rbox(w, 0.035, d, mat(c, { roughness: 0.4 }), 0, 0.715, 0, 0.012);
  h.box(w - 0.22, 0.07, d - 0.22, woodM(dk), 0, 0.645, 0);
  const ty = 0.75;
  h.box(w * 0.7, 0.003, 0.32, mat('#b9a58c', { roughness: 0.9 }), 0, ty, 0);
  const ns = Math.max(1, Math.round(w / 0.62)), ww = w - 0.2;
  for (const sz of [-1, 1]) for (let i = 0; i < ns; i++) {
    const x = -ww / 2 + ww * (i + 0.5) / ns, z = sz * (d / 2 - 0.2);
    h.box(0.38, 0.004, 0.28, mat('#e7dfd1', { roughness: 0.9 }), x, ty, z);
    plate(h, x, ty + 0.004, z, 0.11);
    h.cyl(0.03, 0.026, 0.09, mat('#dfeaee', { roughness: 0.05, transparent: true, opacity: 0.45 }), x + 0.15, ty, z - sz * 0.06, 14);
  }
  vase(h, 0, ty, 0, { h: 0.26, r: 0.065, flowers: true, color: '#efe6d6' });
};

};

  h.box(w, 0.7, 0.33, woodM(c), 0, 1.48, bz + 0.165);

function laundry(h, w, d, c, glassCol) {
  const fz = d / 2;
  h.rbox(w, 0.81, d - 0.02, mat(c, { roughness: 0.35 }), 0, 0.04, 0, 0.02);
  h.rbox(w - 0.02, 0.1, 0.012, mat(lighter(c, 0.3), { roughness: 0.3 }), 0, 0.74, fz - 0.01, 0.006);
  h.box(0.16, 0.05, 0.008, mat('#dcdfe2', { roughness: 0.3 }), -w * 0.28, 0.765, fz - 0.003);
  h.box(0.09, 0.03, 0.006, led('#39d0a8', 0.6), 0.02, 0.775, fz - 0.002);
  h.cylZ(0.03, 0.03, 0.02, chrome(), w * 0.28, 0.79, fz + 0.0, 20);
  const R0 = Math.min(w, d) * 0.25, cy = 0.4;
  h.cylZ(R0, R0, 0.02, mat('#111214', { roughness: 0.4 }), 0, cy, fz - 0.002, 32);
  const rg = h.add(cg(`tor${q(R0 * 1.3)}`, () => new THREE.TorusGeometry(R0 * 1.3, 0.018, 10, 40)), mat('#b5bbc0', { metalness: 0.9, roughness: 0.25 }), 0, cy, fz + 0.005);
  const dome = h.add(cg(`dome${q(R0)}`, () => new THREE.SphereGeometry(R0 * 1.3, 32, 12, 0, PI * 2, 0, PI / 2).scale(1, 0.3, 1)),
    mat(glassCol, { roughness: 0.05, transparent: true, opacity: 0.8, side: DS, depthWrite: false }), 0, cy, fz + 0.005);
  dome.rotation.x = PI / 2;
}

/* ------------------------------------------------------------------ ışık / gökyüzü / gece */
function applyLight() {
  if (!inited) return;
  const night = opt.night;
  const t = (opt.hour - 6) / 12;
  const az = Math.PI * (0.15 + 0.7 * t);
  const el = Math.sin(Math.PI * t) * 1.05 + 0.15;
  const warm = 1 - Math.sin(Math.PI * t);
  sun.position.set(Math.cos(az) * 18, Math.sin(el) * 20 + 3, -Math.sin(az) * 10 + 8);
  sun.color.setHSL(0.09, 0.5 + warm * 0.4, 0.92 - warm * 0.12);
  sun.intensity = night ? 0.05 : 1.4 + Math.sin(Math.PI * t) * 1.6;
  hemi.intensity = night ? 0.12 : 1.1;
  scene.background.set(night ? 0x1c2130 : 0xf7f4ee);
  ground.material.color.set(night ? 0x2a2e38 : 0xf2eee7);
  renderer.toneMappingExposure = night ? 1.25 : 1.05;
  applyLamps();
  envMats.forEach(m => { m.envMapIntensity = (m.userData._envBase || 0.5) * (night ? 0.15 : 1); });
  const sv = $('#sunVal'); if (sv) sv.textContent = fmtHour(opt.hour);
}
function applyLamps() {
  const on = grow > 0.99;
  lamps.forEach(l => {
    l.light.intensity = on && opt.night ? 6 : 0;
    l.disc.material.emissiveIntensity = opt.night ? 2 : 0.3;

}
function applyGrow() {
  if (!inited) return;

  furnG.scale.y = Math.max(furnGrow, 0.001);
  applyLamps();
}

const noRay = () => {};

}
const R = a => [X(a[0]), Z(a[1]), X(a[2]), Z(a[3])];

function buildArch() {

    addBox(archPick, x0, z0, x1, z1, 0, h, wm);
    colliders.push([Math.min(x0, x1), Math.min(z0, z1), Math.max(x0, x1), Math.max(z0, z1)]);
    // gezinti yardımcıları

    e.position.set((x0 + x1) / 2, h / 2, (z0 + z1) / 2); e.raycast = noRay; walkG.add(e);

    sb.position.set((x0 + x1) / 2, bh / 2, (z0 + z1) / 2); sb.raycast = noRay; walkG.add(sb);
  });

  // ---- pencereler
  gWins().forEach((wn, i) => {
    const rect = Array.isArray(wn) ? wn : wn.rect;
    const [x0, z0, x1, z1] = R(rect);
    const sillV = (Array.isArray(wn) ? wn[4] : wn.sill);
    const topV = (Array.isArray(wn) ? wn[5] : wn.top);
    const sill = typeof sillV === 'number' ? (sillV > 20 ? sillV / 1000 : sillV) : (i === 0 ? 1.4 : 0.9);
    const head = typeof topV === 'number' ? (topV > 20 ? topV / 1000 : topV) : 2.4;
    colliders.push([Math.min(x0, x1), Math.min(z0, z1), Math.max(x0, x1), Math.max(z0, z1)]);
    if (sill > 0) addBox(archPick, x0, z0, x1, z1, 0, Math.min(sill, cut), wm);
    if (cut > head) addBox(archPick, x0, z0, x1, z1, head, cut, wm);
    const top = Math.min(head, cut);

      const mm = new THREE.Mesh(new THREE.BoxGeometry(horiz ? 0.04 : 0.06, top - sill, horiz ? 0.06 : 0.04), frameMat);
      mm.position.set(cx + (horiz ? off : 0), (sill + top) / 2, cz + (horiz ? 0 : off));

    const len = horiz ? x1 - x0 : z1 - z0;
    const hh = Math.min(s.v ? 2.4 : 2.1, cut);

  const sideMat = mat('#e9e4da', {});
  gRooms().forEach(r => {

}

}
function leaveWalk(keepPose) {
  if (mode !== 'walk') { mode = 'orbit'; syncChips(); return; }
  if (locked) { try { plc.unlock(); } catch (e) { /* yok say */ } }
  mode = 'orbit'; touchWalk = false; locked = false;
  walkG.visible = false;
  keys.clear(); joyV.x = joyV.y = 0; joyId = null; lookP = null;
  setDisp($('#walkOverlay'), 'none'); setDisp($('#cross'), 'none'); setDisp($('#joy'), 'none'); setDisp($('#walkExit'), 'none');
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const tg = camera.position.clone().addScaledVector(dir, 3); tg.y = Math.max(0, tg.y);
  controls.target.copy(tg);
  camera.position.y = Math.max(camera.position.y, 1.6);
  camera.lookAt(tg);
  if (!keepPose && !busyAnim) controls.enabled = true;
  if (!busyAnim) setLabelsVisible(labelsShouldShow());
  syncChips(); updateHint();
}
function onLock() {
  locked = true;
  setDisp($('#walkOverlay'), 'none'); setDisp($('#cross'), 'block');
}
function onUnlock() {
  locked = false;
  setDisp($('#cross'), 'none');
  if (mode === 'walk' && !touchWalk) setDisp($('#walkOverlay'), 'flex');
}
function startTouchWalk() {
  if (mode !== 'walk') return;
  touchWalk = true;
  const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
  yaw = e.y; pitch = e.x;
  setDisp($('#walkOverlay'), 'none'); setDisp($('#cross'), 'none');
  setDisp($('#joy'), 'block'); setDisp($('#walkExit'), 'block');
  updateHint();
}
function overlayClick() {
  if (mode !== 'walk') return;
  if (coarse()) return startTouchWalk();
  try {
    const p = plc.lock();
    if (p && p.catch) p.catch(() => startTouchWalk());
  } catch (e) { startTouchWalk(); }
}
function blocked(x, z) {
  const r = 0.22;
  for (const c of colliders) if (x > c[0] - r && x < c[2] + r && z > c[1] - r && z < c[3] + r) return true;
  for (const d of doors) {
    const dx = Math.cos(d.cur) * 0.9, dz = -Math.sin(d.cur) * 0.9;
    const px = d.pivot.position.x, pz = d.pivot.position.z;
    const t = clamp(((x - px) * dx + (z - pz) * dz) / (dx * dx + dz * dz), 0, 1);
    if (Math.hypot(x - (px + dx * t), z - (pz + dz * t)) < r * 0.8) return true;
  }
  return false;
}
function walkStep(dt) {
  camera.position.y = 1.6;
  const canMove = touchWalk || locked;
  if (touchWalk) camera.rotation.set(pitch, yaw, 0, 'YXZ');
  if (!canMove) return;
  let f = 0, s = 0;
  if (keys.has('w') || keys.has('arrowup')) f += 1;
  if (keys.has('s') || keys.has('arrowdown')) f -= 1;
  if (keys.has('d') || keys.has('arrowright')) s += 1;
  if (keys.has('a') || keys.has('arrowleft')) s -= 1;
  let speed = keys.has('shift') ? 2.6 : 1.4;
  let mag = 1;
  if (f === 0 && s === 0) {
    const jl = Math.hypot(joyV.x, joyV.y);
    if (jl < 0.05) return;
    f = -joyV.y; s = joyV.x; mag = Math.min(1, jl); speed = 1.4 * mag;
    const n = Math.hypot(f, s) || 1; f /= n; s /= n;
  } else {
    const n = Math.hypot(f, s); f /= n; s /= n;
  }
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0;
  if (dir.lengthSq() < 1e-8) return;
  dir.normalize();
  const rx = -dir.z, rz = dir.x;
  const mx = (dir.x * f + rx * s) * speed * dt, mz = (dir.z * f + rz * s) * speed * dt;
  const p = camera.position;
  if (!blocked(p.x + mx, p.z)) p.x += mx;
  if (!blocked(p.x, p.z + mz)) p.z += mz;
}
function walkDown(e) {
  if (!touchWalk) return;
  if (lookP) return;
  lookP = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (er) { /* yok say */ }
}
function walkMove(e) {
  if (!lookP || e.pointerId !== lookP.id) return;
  yaw += (e.clientX - lookP.x) * 0.005;
  pitch = clamp(pitch + (e.clientY - lookP.y) * 0.005, -1.35, 1.35);
  lookP.x = e.clientX; lookP.y = e.clientY;
}
function walkUp(e, cancel) {
  if (!lookP || e.pointerId !== lookP.id) return;
  const p = lookP; lookP = null; ptr = null;
  if (!cancel && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) <= 9) toggleDoorAt(e.clientX, e.clientY, 3.5);
}
function toggleDoorAt(cx, cy, maxD) {
  setRay(cx, cy);
  const hits = raycaster.intersectObject(archPick, true);
  for (const h of hits) {
    if (h.object.material && h.object.material.transparent) continue;
    const o = ownerOf(h.object);
    if (o.door && h.distance <= maxD) o.door.isOpen = !o.door.isOpen;
    return;
  }
}
function bindWalkUI() {
  const ov = $('#walkOverlay'); if (ov) ov.addEventListener('click', overlayClick);
  const ex = $('#walkExit');
  if (ex) ex.addEventListener('click', () => { setMode('orbit'); flyTo(isoWhole()); });
  const joy = $('#joy');
  if (joy) {
    const knob = $('#joyKnob') || joy.firstElementChild;
    const upd = e => {
      const r = joy.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const l = Math.hypot(dx, dy);
      if (l > 50) { dx = dx / l * 50; dy = dy / l * 50; }
      joyV.x = dx / 50; joyV.y = dy / 50;
      if (knob) knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    };
    joy.addEventListener('pointerdown', e => {
      if (joyId !== null) return;
      joyId = e.pointerId; e.preventDefault(); e.stopPropagation();
      try { joy.setPointerCapture(e.pointerId); } catch (er) { /* yok say */ }
      upd(e);
    });
    joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) { e.preventDefault(); upd(e); } });
    const end = e => {
      if (e.pointerId !== joyId) return;
      joyId = null; joyV.x = joyV.y = 0;
      if (knob) knob.style.transform = '';
    };
    joy.addEventListener('pointerup', end);
    joy.addEventListener('pointercancel', end);
  }
  window.addEventListener('keydown', e => {
    if (mode !== 'walk' || !active) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    const k = e.key.toLowerCase();
    if (k === 'e') {
      const r = renderer.domElement.getBoundingClientRect();
      toggleDoorAt(r.left + r.width / 2, r.top + r.height / 2, 2.5);
      return;
    }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k)) {
      keys.add(k);
      if (k.startsWith('arrow')) e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); });
  window.addEventListener('blur', () => keys.clear());
}

/* ------------------------------------------------------------------ üst bar bağlantıları */
function bindHeader() {
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => { if (!active) return; setMode(b.dataset.mode); }));
  $$('[data-cut]').forEach(b => b.addEventListener('click', () => setCut(b.dataset.cut)));
  $$('[data-t]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.t;
    if (t === 'night') setNight(!opt.night);
    else if (t === 'furn') setFurn(!opt.furn);
    else if (t === 'labels') setLabels(!opt.labels);
  }));
  const sun_ = $('#sun');
  if (sun_) { opt.hour = parseFloat(sun_.value) || 10; sun_.addEventListener('input', () => setHour(sun_.value)); }
  const vi = $('#vIso'), vt = $('#vTop');
  const toOrbit = () => { if (mode === 'walk') setMode('orbit'); };
  if (vi) vi.addEventListener('click', () => { if (!active) return; toOrbit(); markRoomBtn(null); flyTo(isoWhole()); });
  if (vt) vt.addEventListener('click', () => { if (!active) return; toOrbit(); markRoomBtn(null); flyTo(topWhole()); });
  // ilk durumu DOM'dan oku
  const c = $('[data-cut].on'); if (c) opt.cut = parseFloat(c.dataset.cut) || 2.8;
  $$('[data-t]').forEach(b => {
    const on = b.classList.contains('on');
    if (b.dataset.t === 'night') opt.night = on; else if (b.dataset.t === 'furn') opt.furn = on; else if (b.dataset.t === 'labels') opt.labels = on;
  });
  bindWalkUI();
  
}

/* ------------------------------------------------------------------ dışa aktarma */
function toDataURL() {
  if (!inited) return null;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}
function exportPNG(name) {
  const url = toDataURL();
  if (!url) return null;
  const a = document.createElement('a');
  a.href = url; a.download = name || (L('kat-plani-tasarimi', 'floor-plan-design') + '-3D.png');
  document.body.appendChild(a); a.click(); a.remove();
  return url;
}

/* ------------------------------------------------------------------ genel API */
const API = {
  enter, exit,
  toggle() { return active && !busyAnim ? exit() : enter(); },
  sync, resize,
  refresh() { sigLabel = sigList = ''; if (inited && active) { sync(); setTip(true); } updateHint(); },
  onLang() { API.refresh(); },
  setMode, setCut, setNight, setFurn, setLabels, setHour,
  flyToRoom, flyToAll, flyIso() { return flyTo(isoWhole()); }, flyTop() { return flyTo(topWhole()); },
  groundPointAt, screenCenterGround, pxPerMm,
  // 2D tarafının (app.js) kullandığı adlar
  centerGround: screenCenterGround,
  dropPoint: groundPointAt,
  dropInfo(x, y) { const s = pxPerMm(x, y); return s ? { scale: s } : null; },
  onSelect() { /* seçim vurgusu her karede ui.sel'den okunur */ },
  toDataURL, exportPNG,
  walking: () => active && mode === 'walk',
  isWalking: () => active && mode === 'walk',
  isActive: () => active,
  isBusy: () => busyAnim,
  get active() { return active; },
  get busy() { return busyAnim; },
  get mode() { return mode; },
  get opt() { return opt; },
  get ready() { return true; },
  get renderer() { return renderer; },
  get scene() { return scene; },
  get camera() { return camera; },
  init,
  // sınama yardımcısı: kamerayı 2D ile aynı üstten pozuna koyar
  _toPlanPose() { controls.enabled = false; setPose(planPose()); },
};
window.View3D = API;

bindHeader();
syncChips();
window.dispatchEvent(new Event('view3d-ready'));

</script>
